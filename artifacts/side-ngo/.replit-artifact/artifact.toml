kind = "web"
previewPath = "/"
title = "SIDE NGO Website"
version = "1.0.0"
id = "artifacts/side-ngo"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19652

[services.development]
run = "pnpm --filter @workspace/side-ngo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/side-ngo", "run", "build" ]
publicDir = "artifacts/side-ngo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19652"
BASE_PATH = "/"
